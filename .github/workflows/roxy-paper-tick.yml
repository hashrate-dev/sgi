# Hobby Vercel cannot run minute crons. This keeps Roxy ticking on hashrate.space.
name: Roxy paper tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tick armed paper books
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Set GitHub secret CRON_SECRET to the same value as Vercel CRON_SECRET."
            exit 1
          fi
          curl -fsS -X POST "https://hashrate.space/api/paper/cron-tick" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
